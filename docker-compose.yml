services:
  mongodb:
    image: mongo:7
    container_name: db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: YouthDb

  mongo-express:
    image: mongo-express
    container_name: mongo-ui
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin@youth.com
      ME_CONFIG_BASICAUTH_PASSWORD: admin

  backend:
    build: ./backend
    container_name: api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env.dev

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 608842325431-buobeotqh04mjffo7irppi27guqadkvi.apps.googleusercontent.com
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: web
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
